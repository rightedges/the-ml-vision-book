title: "ML Vision: The Roboflow Guide"
description: "A comprehensive guide to building and deploying modern ML vision models."
baseurl: "/the-ml-vision-book"
url: "https://rightedges.github.io"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude VitePress files and node stuff
exclude:
  - docs/
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - vendor/
  - Gemfile
  - Gemfile.lock
